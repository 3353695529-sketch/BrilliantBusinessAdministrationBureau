<h1>注册商铺</h1>
<form action="/api/registerShop" method="POST" enctype="multipart/form-data">
    <input name="shopName" placeholder="商铺名称" required><br>
    <textarea name="description" placeholder="商铺简介" required></textarea><br>
    <input type="file" name="logo" accept="image/*" required><br>
    <button>提交</button>
</form>
