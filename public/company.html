<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>所有公司</title>
</head>
<body>

<h1>所有公司</h1>
<div id="list">正在加载...</div>

<script>
fetch("/api/companies")
  .then(res => res.json())
  .then(data => {
    if (data.length === 0) {
      document.getElementById("list").innerHTML = "暂无公司";
      return;
    }

    document.getElementById("list").innerHTML = data.map(c => `
      <div>
        <h3><a href="/company.html?id=${c.id}">${c.name}</a></h3>
        <p>${c.description}</p>
        <img src="/uploads/${c.logo}" width="120">
      </div>
      <hr>
    `).join("");
  });
</script>

</body>
</html>
