<h1>注册公司</h1>
<form action="/api/registerCompany" method="POST" enctype="multipart/form-data">
    <input name="companyName" placeholder="公司名称" required><br>
    <textarea name="description" placeholder="公司简介" required></textarea><br>
    <input type="file" name="logo" accept="image/*" required><br>
    <button>提交</button>
</form>
