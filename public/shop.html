<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>商铺详情</title>
</head>
<body>

<h1>商铺详情</h1>

<div id="info">正在加载...</div>

<script>
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

fetch("/api/shops")
  .then(res => res.json())
  .then(list => {
    const shop = list.find(s => s.id == id);

    if (!shop) {
      document.getElementById("info").innerHTML = "未找到商铺信息";
      return;
    }

    document.getElementById("info").innerHTML = `
      <h2>${shop.name}</h2>
      <p>${shop.description}</p>
      <img src="/uploads/${shop.logo}" width="150">
    `;
  });
</script>

</body>
</html>
