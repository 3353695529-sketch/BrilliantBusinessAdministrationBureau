<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>所有商铺</title>
</head>
<body>

<h1>所有商铺</h1>
<div id="list">正在加载...</div>

<script>
fetch("/api/shops")
  .then(res => res.json())
  .then(data => {
    if (data.length === 0) {
      document.getElementById("list").innerHTML = "暂无商铺";
      return;
    }

    document.getElementById("list").innerHTML = data.map(s => `
      <div>
        <h3><a href="/shop.html?id=${s.id}">${s.name}</a></h3>
        <p>${s.description}</p>
        <img src="/uploads/${s.logo}" width="120">
      </div>
      <hr>
    `).join("");
  });
</script>

</body>
</html>
