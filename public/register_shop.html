<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>注册商铺</title>
</head>
<body>

<h1>注册商铺</h1>

<form id="shopForm" enctype="multipart/form-data">
    <label>商铺名称：</label>
    <input type="text" name="name" required><br><br>

    <label>商铺简介：</label>
    <textarea name="description" required></textarea><br><br>

    <label>上传商铺 Logo：</label>
    <input type="file" name="logo" accept="image/*" required><br><br>

    <button type="submit">提交注册</button>
</form>

<script>
document.getElementById("shopForm").onsubmit = async (e) => {
    e.preventDefault();

    const formData = new FormData(e.target);

    const res = await fetch("/api/registerShop", {
        method: "POST",
        body: formData
    });

    const data = await res.json();

    if (data.success) {
        window.location.href = `/shop.html?id=${data.id}`;
    }
};
</script>

</body>
</html>
