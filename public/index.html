<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>璀璨工商管理局</title>
<style>
/* ===========================
   加载动画
=========================== */
#loading {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.85);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  color: white;
  font-family: "Microsoft YaHei";
  transition: opacity .5s ease;
}

.loader {
  width: 60px;
  height: 60px;
  border: 6px solid rgba(255,255,255,0.2);
  border-top-color: #00eaff;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin-bottom: 20px;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* ===========================
   页面主要样式
=========================== */
body {
  margin: 0;
  padding: 0;
  background: #0a0f24;
  color: white;
  font-family: "Microsoft YaHei";
  text-align: center;
}

header {
  padding: 40px 0;
  font-size: 40px;
  font-weight: bold;
  letter-spacing: 2px;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(255,255,255,0.1);
}

#userInfo {
  margin-top: 20px;
  font-size: 18px;
}

#userInfo img {
  border-radius: 50%;
  margin-bottom: 10px;
}

#steamLogin {
  padding: 12px 25px;
  background: #00aaff;
  border: none;
  border-radius: 8px;
  color: white;
  font-size: 18px;
  cursor: pointer;
  transition: 0.3s;
}

#steamLogin:hover {
  background: #0088dd;
}

.container {
  margin-top: 60px;
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 25px;
}

.card {
  width: 260px;
  padding: 25px;
  background: rgba(255,255,255,0.08);
  border-radius: 15px;
  box-shadow: 0 20px 30px rgba(0,0,0,0.4);
  transition: 0.3s;
  cursor: pointer;
  border: 1px solid rgba(255,255,255,0.1);
}

.card:hover {
  transform: translateY(-10px);
  background: rgba(255,255,255,0.1);
  box-shadow: 0 30px 40px rgba(0,0,0,0.6);
}

.card h2 {
  margin-bottom: 15px;
  font-size: 24px;
}

.card p {
  opacity: 0.8;
  font-size: 16px;
}

footer {
  margin-top: 100px;
  padding: 20px;
  opacity: 0.5;
  font-size: 16px;
}
</style>
</head>

<body>

<!-- 加载动画 -->
<div id="loading">
  <div class="loader"></div>
  <p>正在加载数据，请稍候...</p>
</div>

<script>
window.onload = () => {
  const loading = document.getElementById("loading");
  loading.style.opacity = "0";
  setTimeout(() => loading.style.display = "none", 500);
};
</script>

<header>欢迎访问工程师导航站</header>

<!-- Steam 用户信息显示区 -->
<div id="userInfo">正在加载用户信息...</div>

<script>
// 获取 Steam 登录状态
fetch("/api/user")
  .then(res => res.json())
  .then(data => {
    const box = document.getElementById("userInfo");

    if (!data.loggedIn) {
      box.innerHTML = `
        <button id="steamLogin">使用 Steam 登录</button>
      `;
      document.getElementById("steamLogin").onclick = () => {
        window.location.href = "/auth/steam";
      };
    } else {
      box.innerHTML = `
        <img src="${data.avatar}" width="64">
        <p>欢迎你，${data.name}</p>
        <a href="/logout" style="color:#00eaff;">退出登录</a>
      `;
    }
  });
</script>

<!-- 主功能区 -->
<div class="container">
  <a href="register_company.html" style="text-decoration:none;color:white;">
    <div class="card">
      <h2>企业注册</h2>
      <p>创建您的公司账户 上传 Logo 注册工程师</p>
    </div>
  </a>

  <a href="register_shop.html" style="text-decoration:none;color:white;">
    <div class="card">
      <h2>商铺注册</h2>
      <p>创建您的商铺账户 新店铺注册</p>
    </div>
  </a>

  <a href="companies.html" style="text-decoration:none;color:white;">
    <div class="card">
      <h2>企业导航</h2>
      <p>浏览企业信息 查找公司</p>
    </div>
  </a>

  <a href="shops.html" style="text-decoration:none;color:white;">
    <div class="card">
      <h2>商铺导航</h2>
      <p>浏览商铺信息 查找商铺</p>
    </div>
  </a>
</div>

<footer>© 工程师导航站版权所有</footer>

</body>
</html>
